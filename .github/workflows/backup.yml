name: Weekly database backup

# A copy of the schema and the data that lives somewhere other than Supabase.
#
# Supabase takes its own backups, and on the free plan those are daily with a
# short retention and no way to download them. That is a fine first line and a
# poor only line: it protects against a disk failing, not against the project
# being deleted, the account being locked, or a migration doing exactly what it
# was told to do. This is the second copy.
#
# WHAT IT PRODUCES
#   A single gzipped pg_dump, encrypted with a passphrase, stored as a private
#   GitHub Actions artefact for 90 days. Artefacts on a private repository are
#   visible only to people who can already read the repository, and the file is
#   encrypted on top of that, so the passphrase is what actually protects it.
#
# WHAT IT NEEDS (repository secrets, Settings -> Secrets and variables -> Actions)
#   SUPABASE_ACCESS_TOKEN   supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    the subdomain of your project URL, not a secret but
#                           kept here so the file names nothing about the project
#   SUPABASE_DB_PASSWORD    the database password, Project Settings -> Database
#   BACKUP_PASSPHRASE       any long random string. openssl rand -base64 32
#
# Until those exist the job stops at the first step and says which one is
# missing, rather than uploading an empty file that looks like a backup.
#
# RESTORING
#   gpg --decrypt --batch --passphrase "$BACKUP_PASSPHRASE" studentos-*.sql.gz.gpg > dump.sql.gz
#   gunzip dump.sql.gz
#   psql "$DATABASE_URL" -f dump.sql

on:
  schedule:
    # 04:41 UTC every Sunday. Off the hour because that is where every other
    # scheduled job in the world sits.
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: Dump and encrypt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the secrets exist
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # if-statements rather than `[ ... ] && ...`, because the default
          # shell here is `bash -e` and a false test would end the step.
          missing=""
          if [ -z "$ACCESS_TOKEN" ]; then missing="$missing SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "$PROJECT_REF" ];  then missing="$missing SUPABASE_PROJECT_REF"; fi
          if [ -z "$DB_PASSWORD" ];  then missing="$missing SUPABASE_DB_PASSWORD"; fi
          if [ -z "$PASSPHRASE" ];   then missing="$missing BACKUP_PASSPHRASE"; fi
          if [ -n "$missing" ]; then
            echo "Not configured. Missing repository secrets:$missing"
            echo "Add them at Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All four secrets are present."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Dump roles, schema and data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          # Three dumps because pg_dump cannot express roles and data in one
          # restorable file. Concatenated in restore order.
          supabase db dump --role-only  -f roles.sql
          supabase db dump              -f schema.sql
          supabase db dump --data-only  -f data.sql
          cat roles.sql schema.sql data.sql | gzip -9 > "studentos-$stamp.sql.gz"
          rm -f roles.sql schema.sql data.sql
          ls -lh "studentos-$stamp.sql.gz"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # The passphrase reaches gpg on a file descriptor, never in the
          # argument list where the runner would log it.
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --symmetric \
            --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output "studentos-$STAMP.sql.gz.gpg" \
            "studentos-$STAMP.sql.gz"
          rm -f "studentos-$STAMP.sql.gz"
          ls -lh "studentos-$STAMP.sql.gz.gpg"

      - uses: actions/upload-artifact@v7
        with:
          name: studentos-backup-${{ env.STAMP }}
          path: studentos-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
